<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Miksy</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  height: 100vh;
  background: radial-gradient(circle at top, #1a0022, #000);
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
}

.card {
  background: rgba(255, 255, 255, 0.08);
  padding: 30px;
  border-radius: 20px;
  text-align: center;
  width: 320px;
  backdrop-filter: blur(10px);
  box-shadow: 0 0 30px purple;
  animation: fadeIn 1s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.9); }
  to { opacity: 1; transform: scale(1); }
}

.avatar {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  border: 3px solid hotpink;
  margin-bottom: 15px;
}

h1 {
  color: cyan;
  margin-bottom: 5px;
}

.location {
  opacity: 0.8;
  margin-bottom: 20px;
}

.links a {
  display: block;
  margin: 10px 0;
  padding: 12px;
  border-radius: 10px;
  background: rgba(255,255,255,0.1);
  color: white;
  text-decoration: none;
  transition: 0.3s;
}

.links a:hover {
  background: hotpink;
  box-shadow: 0 0 15px hotpink;
  transform: scale(1.05);
}
</style>
</head>

<body>

<audio id="music" src="music.mp3" loop></audio>

<div class="card">
  <!-- DISCORD AVATAR (GIF ILI PNG) -->
  <img src="avatar.gif" class="avatar">

  <h1>Miksy</h1>
  <p class="location">Frankfurt · Germanyyy</p>

  <div class="links">
    <a href="#">Discord</a>
    <a href="#">Instagram</a>
    <a href="#">YouTube</a>
  </div>
</div>

<script>
document.body.addEventListener("click", () => {
  document.getElementById("music").play();
});
</script>

</body>
</html>
